<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Monitoring System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            padding: 2rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2e7d32;
            margin-bottom: 1rem;
            font-size: 2.5rem;
        }

        .subheading {
            color: #666;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #333;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            background-color: #2e7d32;
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #1b5e20;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Energy Consumption Monitoring</h1>
        <p class="subheading">Track and optimize your electricity usage with real-time analytics</p>

        <div id="registration-section">
            <div class="form-section">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="full-name" placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" id="contact-number" placeholder="+1 234 567 890">
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email-address" placeholder="john@example.com">
                </div>

                <div class="form-group">
                    <label>Physical Address</label>
                    <textarea id="physical-address" rows="4" placeholder="Enter full address including postal code"></textarea>
                </div>
            </div>

            <div class="form-section">
                <h2>Set Password & Verify</h2>
                <div class="form-group">
                    <label>Set Password</label>
                    <input type="password" id="password" placeholder="Enter a strong password">
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Re-enter your password">
                </div>

                <button id="send-code">Send Confirmation Code</button>
            </div>
        </div>

        <div id="otp-section" class="hidden">
            <h2>Enter OTP</h2>
            <div class="form-group">
                <label>Confirmation Code</label>
                <input type="text" id="otp" placeholder="Enter OTP">
            </div>
            <button id="verify-otp">Verify OTP</button>
        </div>
    </div>
    
    <script>
        document.getElementById("send-code").addEventListener("click", function() {
            let email = document.getElementById("email-address").value;
            let phone = document.getElementById("contact-number").value;
            
            if(email && phone) {
                alert("A confirmation code has been sent to your email and phone number.");
                console.log("Switching to OTP section");
                document.getElementById("registration-section").classList.add("hidden");
                document.getElementById("otp-section").classList.remove("hidden");
            } else {
                alert("Please enter a valid email and contact number.");
            }
        });

        document.getElementById("verify-otp").addEventListener("click", function() {
            let otp = document.getElementById("otp").value;
            let correctOtp = "123456"; // Simulated correct OTP
            
            if(otp === correctOtp) {
                alert("OTP verified successfully! Redirecting to add appliances page...");
                window.location.href = "add_appliances.html";
            } else {
                alert("Invalid OTP. Please try again.");
            }
        });
    </script>
</body>
</html>
